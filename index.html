<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Financeiro</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

<header>

    <div class="logo">
        💰 Gestão Financeira
    </div>
<div class="usuario-area">

        <span id="usuarioNome"></span>

        <button
            onclick="sair()"
            class="botao-sair"
        >
            Sair
        </button>

    </div>

</header>


<main class="container">

    <h1>Dashboard</h1>

    <p class="subtitulo">
        Controle suas receitas e despesas de forma simples.
    </p>


    <!-- RESUMO -->

    <div class="cards">

        <div class="card">

            <h3>Saldo atual</h3>

            <p class="saldo">
                R$ 0,00
            </p>

        </div>


        <div class="card">

            <h3>Receitas</h3>

            <p class="receita">
                R$ 0,00
            </p>

        </div>


        <div class="card">

            <h3>Despesas</h3>

            <p class="despesa">
                R$ 0,00
            </p>

        </div>

    </div>


    <!-- NOVO LANÇAMENTO -->

    <section class="painel">

        <h2>➕ Novo lançamento</h2>


        <form id="formFinanceiro">

            <div class="campo">

                <label>Descrição</label>

                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex: Mercado"
                    required
                >

            </div>


            <div class="campo">

                <label>Valor</label>

                <input
                    type="number"
                    id="valor"
                    placeholder="0,00"
                    step="0.01"
                    min="0.01"
                    required
                >

            </div>


            <div class="campo">

                <label>Tipo</label>

                <select id="tipo">

                    <option value="receita">
                        Receita
                    </option>

                    <option value="despesa">
                        Despesa
                    </option>

                </select>

            </div>


            <div class="campo">

                <label>Categoria</label>

                <select id="categoria">

                    <option value="Alimentação">
                        🍔 Alimentação
                    </option>

                    <option value="Transporte">
                        🚗 Transporte
                    </option>

                    <option value="Moradia">
                        🏠 Moradia
                    </option>

                    <option value="Lazer">
                        🎬 Lazer
                    </option>

                    <option value="Saúde">
                        💊 Saúde
                    </option>

                    <option value="Educação">
                        📚 Educação
                    </option>

                    <option value="Salário">
                        💰 Salário
                    </option>

                    <option value="Outros">
                        📦 Outros
                    </option>

                </select>

            </div>


            <div class="campo">

                <label>Data</label>

                <input
                    type="date"
                    id="data"
                >

            </div>


            <button type="submit">
                + Adicionar
            </button>

        </form>

    </section>


    <!-- GRÁFICO -->

    <section class="painel">

        <h2>📊 Gastos por categoria</h2>

        <div id="graficoGastos">

            <p class="vazio">
                Nenhuma despesa cadastrada.
            </p>

        </div>

    </section>


    <!-- LANÇAMENTOS -->

    <section class="painel">

        <div class="titulo-historico">

            <h2>📋 Lançamentos</h2>

            <select id="filtro">

                <option value="todos">
                    Todos
                </option>

                <option value="receita">
                    Receitas
                </option>

                <option value="despesa">
                    Despesas
                </option>

            </select>

        </div>


        <div id="listaLancamentos">

            <p class="vazio">
                Nenhum lançamento encontrado.
            </p>

        </div>

    </section>

</main>
<script>

    const usuarioLogado =
        localStorage.getItem("usuarioLogado");

    if (usuarioLogado !== "true") {

        window.location.href = "login.html";

    }


    const usuarioAtual =
        localStorage.getItem("usuarioAtual");


    const usuarioNome =
        document.getElementById("usuarioNome");


    if (usuarioNome && usuarioAtual) {

        usuarioNome.textContent =
            "Olá, " + usuarioAtual;

    }


    function sair() {

        localStorage.removeItem(
            "usuarioLogado"
        );

        localStorage.removeItem(
            "usuarioAtual"
        );

        window.location.href =
            "login.html";

    }

</script>

</script>

<script src="./script.js"></script>

</body>

</html>
